name: build-immortalwrt-noplugins

on:
  workflow_dispatch:

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: free-disk-space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 1
          ref: ${{ github.ref }}

      # 缓存 dl
      - name: Cache dl directory
        uses: actions/cache@v3
        with:
          path: dl
          key: dl-${{ runner.os }}-${{ hashFiles('config/myconfig_noplugins') }}
          restore-keys: |
            dl-${{ runner.os }}-

      # 只缓存 build_dir 里的工具链，避免源码变动导致冲突
      - name: Cache toolchain
        uses: actions/cache@v3
        with:
          path: build_dir/toolchain
          key: toolchain-${{ runner.os }}-${{ hashFiles('config/myconfig_noplugins') }}
          restore-keys: |
            toolchain-${{ runner.os }}-

      - name: Install build dependencies
        run: |
          sudo apt update -y
          sudo apt full-upgrade -y
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
            libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano \
            ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

      - name: Setup ccache
        run: |
          echo 'export CC="ccache gcc"' >> $GITHUB_ENV
          echo 'export CXX="ccache g++"' >> $GITHUB_ENV
          echo 'export PATH="/usr/lib/ccache:$PATH"' >> $GITHUB_ENV

      - name: Build immortalwrt firmware
        run: |
          echo "Start building immortalwrt firmware..."
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cp config/myconfig_noplugins .config
          make defconfig
          sed -i "s/192.168.1.1/192.168.5.1/g" package/base-files/files/bin/config_generate
          make download -j$(nproc)
          make toolchain/install -j$(nproc)  # 先构建工具链
          make -j$(nproc) V=s                # 再编译固件
          echo "Build finished."
          
      - name: Get datetime
        id: datetime
        run: |
          echo "tag=$(TZ=Asia/Shanghai date +'%Y-%m-%d_%H-%M-%S')" >> $GITHUB_OUTPUT
        
      - name: Upload firmware to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.datetime.outputs.tag }}
          files: "bin/targets/**/*.bin"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
